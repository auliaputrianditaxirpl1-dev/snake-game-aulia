<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Project Snake</title>

    <style>
        body {
            margin: 0;
            background: #231e2d;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        canvas {
            background: #231e2d;
            border: 2px solid #373241;
            display: block;
        }

        .info {
            margin-top: 10px;
            font-size: 20px;
        }

        .control {
            margin-top: 8px;
            color: #ddd;
        }
    </style>
</head>

<body>

<div class="game-container">
    <h1>Mini Project Snake</h1>

    <canvas id="game" width="800" height="600"></canvas>

    <div class="info">
        Skor: <span id="score">0</span>
    </div>

    <div class="control">
        Gunakan tombol WASD / Panah untuk bergerak
    </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const WIDTH = 800;
const HEIGHT = 600;
const GRID = 20;

const BACKGROUND = "#231e2d";
const GRID_COLOR = "#373241";
const GREEN = "#32c850";
const RED = "#dc3232";
const WHITE = "#ffffff";
const HAIR_COLOR = "#ffb4c8";

let ular;
let arah;
let makanan;
let skor;
let warnaUlar;
let gameOver;

function posisiMakanan() {
    const x = Math.floor(Math.random() * (WIDTH / GRID)) * GRID;
    const y = Math.floor(Math.random() * (HEIGHT / GRID)) * GRID;

    return {
        x: x,
        y: y
    };
}

function buatMakanan(jumlah) {
    let hasil = [];

    for (let i = 0; i < jumlah; i++) {
        hasil.push(posisiMakanan());
    }

    return hasil;
}

function warnaAcak() {
    const r = Math.floor(Math.random() * 206) + 50;
    const g = Math.floor(Math.random() * 206) + 50;
    const b = Math.floor(Math.random() * 206) + 50;

    return `rgb(${r}, ${g}, ${b})`;
}

function resetGame() {
    ular = [
        { x: 400, y: 300 },
        { x: 380, y: 300 },
        { x: 360, y: 300 }
    ];

    arah = {
        x: GRID,
        y: 0
    };

    makanan = buatMakanan(10);
    skor = 0;
    warnaUlar = GREEN;
    gameOver = false;

    document.getElementById("score").textContent = skor;
}

document.addEventListener("keydown", function(event) {
    if (gameOver && event.key.toLowerCase() === "r") {
        resetGame();
        return;
    }

    if (gameOver) {
        return;
    }

    const key = event.key.toLowerCase();

    if ((key === "arrowup" || key === "w") && arah.y !== GRID) {
        arah = { x: 0, y: -GRID };
    }

    else if ((key === "arrowdown" || key === "s") && arah.y !== -GRID) {
        arah = { x: 0, y: GRID };
    }

    else if ((key === "arrowleft" || key === "a") && arah.x !== GRID) {
        arah = { x: -GRID, y: 0 };
    }

    else if ((key === "arrowright" || key === "d") && arah.x !== -GRID) {
        arah = { x: GRID, y: 0 };
    }
});

function update() {
    if (gameOver) {
        return;
    }

    const kepalaLama = ular[0];

    const kepalaBaru = {
        x: kepalaLama.x + arah.x,
        y: kepalaLama.y + arah.y
    };

    let makananDimakan = false;

    for (let i = 0; i < makanan.length; i++) {
        if (
            kepalaBaru.x === makanan[i].x &&
            kepalaBaru.y === makanan[i].y
        ) {
            skor++;
            warnaUlar = warnaAcak();

            makanan[i] = posisiMakanan();

            makananDimakan = true;
            break;
        }
    }

    ular.unshift(kepalaBaru);

    if (!makananDimakan) {
        ular.pop();
    }

    // Tabrakan dengan batas layar
    if (
        kepalaBaru.x < 0 ||
        kepalaBaru.x >= WIDTH ||
        kepalaBaru.y < 0 ||
        kepalaBaru.y >= HEIGHT
    ) {
        gameOver = true;
    }

    // Tabrakan dengan tubuh sendiri
    for (let i = 1; i < ular.length; i++) {
        if (
            kepalaBaru.x === ular[i].x &&
            kepalaBaru.y === ular[i].y
        ) {
            gameOver = true;
            break;
        }
    }

    document.getElementById("score").textContent = skor;
}

function gambarGrid() {
    ctx.strokeStyle = GRID_COLOR;
    ctx.lineWidth = 1;

    for (let x = 0; x < WIDTH; x += GRID) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, HEIGHT);
        ctx.stroke();
    }

    for (let y = 0; y < HEIGHT; y += GRID) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(WIDTH, y);
        ctx.stroke();
    }
}

function gambarMakanan() {
    ctx.fillStyle = RED;

    for (let item of makanan) {
        ctx.beginPath();
        ctx.arc(
            item.x + GRID / 2,
            item.y + GRID / 2,
            GRID / 2,
            0,
            Math.PI * 2
        );
        ctx.fill();
    }
}

function gambarUlar() {
    ctx.fillStyle = warnaUlar;

    for (let bagian of ular) {
        ctx.fillRect(
            bagian.x,
            bagian.y,
            GRID,
            GRID
        );
    }
}

function gambarRambut() {
    const kepala = ular[0];
    const x = kepala.x;
    const y = kepala.y;

    ctx.fillStyle = HAIR_COLOR;

    if (arah.x === GRID) {
        ctx.beginPath();

        ctx.moveTo(x + 3, y);
        ctx.lineTo(x + 8, y - 7);
        ctx.lineTo(x + 12, y);
        ctx.lineTo(x + 16, y - 7);
        ctx.lineTo(x + 20, y);

        ctx.fill();
    }

    else if (arah.x === -GRID) {
        ctx.beginPath();

        ctx.moveTo(x, y);
        ctx.lineTo(x + 4, y - 7);
        ctx.lineTo(x + 8, y);
        ctx.lineTo(x + 13, y - 7);
        ctx.lineTo(x + 18, y);

        ctx.fill();
    }
}

function gambarGameOver() {
    if (!gameOver) {
        return;
    }

    ctx.fillStyle = RED;
    ctx.font = "64px Arial";
    ctx.textAlign = "center";

    ctx.fillText(
        "GAME OVER",
        WIDTH / 2,
        HEIGHT / 2 - 40
    );

    ctx.fillStyle = WHITE;
    ctx.font = "36px Arial";

    ctx.fillText(
        "Tekan R untuk bermain lagi",
        WIDTH / 2,
        HEIGHT / 2 + 30
    );
}

function draw() {
    ctx.fillStyle = BACKGROUND;
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    gambarGrid();
    gambarMakanan();
    gambarUlar();
    gambarRambut();
    gambarGameOver();
}

function gameLoop() {
    update();
    draw();

    const kecepatan = 100 - (skor / 3 | 0) * 10;

    setTimeout(gameLoop, Math.max(40, kecepatan));
}

resetGame();
gameLoop();
</script>

</body>
</html>
