<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game">

    <h1>🐍 Snake Game</h1>

    <div class="info">
        <span>Score: <b id="score">0</b></span>
        <span>High Score: <b id="highScore">0</b></span>
    </div>

    <div class="board">
        <canvas id="canvas"></canvas>

        <div id="startScreen">
            <h2>Snake Game</h2>
            <button id="startButton">MULAI</button>
        </div>

        <div id="gameOver" class="hidden">
            <h2>GAME OVER</h2>
            <p>Score: <b id="finalScore">0</b></p>
            <button id="restartButton">MAIN LAGI</button>
        </div>
    </div>

    <div class="controls">
        <button data-direction="up">▲</button>

        <div>
            <button data-direction="left">◀</button>
            <button data-direction="down">▼</button>
            <button data-direction="right">▶</button>
        </div>
    </div>

    <p class="text">WASD / Arrow atau tombol di layar</p>

</div>

<script src="script.js"></script>

</body>
</html>
